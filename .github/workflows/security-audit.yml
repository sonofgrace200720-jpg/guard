name: security-audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: gradle lint test --stacktrace
      - name: Secret scan
        run: |
          ! grep -RInE '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|api[_-]?key[[:space:]]*[:=]|password[[:space:]]*[:=])' app --exclude='*.xml' --exclude-dir=build
      - name: Dependency manifest
        run: gradle dependencies --configuration debugRuntimeClasspath > dependency-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-security-report
          path: dependency-report.txt
