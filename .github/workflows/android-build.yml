name: android-build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager --channel=1 'platforms;android-37' 'build-tools;36.0.0'
      - run: gradle test lint assembleDebug --stacktrace
      - run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: disposable-privacy-workspace-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
