name: android-test
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - run: sdkmanager --channel=1 'platforms;android-37.0' 'system-images;android-37.0;google_apis;x86_64' 'emulator' 'platform-tools' 'build-tools;37.0.0'
      - run: |
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -d "$ANDROID_SDK_ROOT/platforms/android-37"
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: echo "no KVM-dependent emulator is forced in the source workflow; instrumentation runs on device-enabled runners"
      - run: gradle test lint --stacktrace
